<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una sorpresa está esperando...</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
      <!-- Fondo del espacio -->
    <div id="space"></div>

    <!-- Estrellas -->
    <div id="stars"></div>

    <!-- Estrellas fugaces -->
    <div id="shooting-stars"></div>

    <!-- Caja de regalo -->
    <div class="gift-box">
        🎁
    </div>

    <!-- Contador -->
    <div class="countdown">
        <h1>Una sorpresa está esperando...</h1>

        <div id="timer">
            00 Días : 00 Horas : 00 Minutos : 00 Segundos
        </div>

        <p>
            Toca las estrellas para descubrir pequeños mensajes ✨
        </p>
    </div>

    <script src="script.js"></script>

</body>

</html>
